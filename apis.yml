name: Volt14
description: Volt14 Solutions Pte Ltd is a Singapore-based deep-tech startup developing silicon-majority
  anode materials for lithium-ion batteries. Its fully integrated, tunable, and ready-to-use anodes
  replace conventional graphite to deliver large gains in energy density and lower normalized cell
  cost, while remaining compatible with existing battery cell manufacturing infrastructure. Target
  application markets include electric vehicles, consumer electronics, appliances, and power tools.
  The company is a materials-science and battery-technology producer; it publishes a corporate
  and careers website but exposes no public developer or API product surface. Backed by 500 Global.
